<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>dogs barking - may peace prevail on planet earth - stream</title>

    <style>

        @font-face {
            font-family: "MyCustomMincho";
            src: url("IPAMINCHO REGULAR.TTF") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            font-family: "MyCustomMincho", serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .player {
            position: relative;
            width: min(387px, 100%);
            aspect-ratio: 9 / 16;
            background-image: url("player_background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            box-shadow: 0 0 0px rgba(255, 255, 255, 0.08);
        }

        .player-interface {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 337.5px;
            max-width: 80%;
            background: rgba(0, 0, 0, 0);
            color: red;
            padding: 13.5px;
            border-radius: 6px;
            font-family: "MyCustomMincho", serif;
            text-align: center;
        }

        .song-title {
            text-align: center;
            font-size: 18.75px;
            margin-bottom: 10.8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: red;
            font-family: "MyCustomMincho", serif;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18.75px;
            margin-bottom: 10.8px;
        }

        .control-button {
            border: none;
            background: transparent;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-button img {
            display: block;
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .control-button:hover {
            background: transparent;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .playlist {
            overflow: visible;
            border-top: 1px solid rgba(255, 0, 0, 0.3);
            padding-top: 7.2px;
            width: 100%;
            text-align: left;
        }

        .song {
            padding: 7.2px;
            cursor: pointer;
            border-radius: 3px;
            font-family: "MyCustomMincho", serif;
            font-size: 17.5px;
            color: red;
            width: 100%;
            text-align: left;
        }

        .song:hover {
            background: rgba(255, 0, 0, 0.12);
        }

        .song.active {
            background: rgba(255, 0, 0, 0.22);
        }

        .content-below-player {
            width: 75vw;
            max-width: 75%;
            margin-top: 30px;
            text-align: center;
        }

        .custom-gif {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .cd-message {
            margin-top: 18px;
            color: red;
            font-family: "MyCustomMincho", serif;
            font-size: 18px;
            line-height: 1.4;
            text-align: center;
        }

        @media (max-width: 600px) {

            .page {
                padding: 10px;
            }

            .player {
                width: min(437.4px, calc(100vw - 20px));
            }

            .player-interface {
                width: 80.73%;
                padding: 10.35px;
            }

            .song-title {
                font-size: 10.0625px;
                margin-bottom: 8.28px;
            }

            .control-button img {
                width: 28px;
                height: 28px;
            }

            .controls {
                gap: 14.375px;
                margin-bottom: 8.28px;
            }

            .playlist {
                overflow: visible;
                padding-top: 8.28px;
                width: 100%;
                text-align: left;
            }

            .song {
                padding: 6.21px;
                font-size: 12.9375px;
                text-align: left;
            }

            .content-below-player {
                width: 90vw;
                max-width: 90%;
                margin-top: 20px;
            }

            .cd-message {
                font-size: 14px;
                margin-top: 12px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="player">

        <div class="player-interface">

            <div class="song-title" id="songTitle">
                Select a song
            </div>

            <div class="controls">

                <button
                    class="control-button"
                    id="previousButton"
                    aria-label="Previous song">

                    <img
                        src="back.png"
                        alt="Previous song">

                </button>

                <button
                    class="control-button"
                    id="playButton"
                    aria-label="Play">

                    <img
                        id="playButtonImage"
                        src="play.png"
                        alt="Play">

                </button>

                <button
                    class="control-button"
                    id="nextButton"
                    aria-label="Next song">

                    <img
                        src="forward.png"
                        alt="Next song">

                </button>

            </div>

            <div
                class="playlist"
                id="playlist">
            </div>

        </div>

    </div>

    <div class="content-below-player">

        <img
            class="custom-gif"
            src="your-custom-gif.gif"
            alt="">

        <div class="cd-message">
            CD ORDERS AVAILABLE SOON - HIGH QUALITY EDITION
        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>

    const songs = [

        {
            title: "01 FOODS FOR WHITE TEETH",
            file: "01 Foods For White Teeth.mp3"
        },

        {
            title: "02 CHAMBER",
            file: "02 Chamber.mp3"
        },

        {
            title: "03 FAMINESTA",
            file: "03 Faminesta.mp3"
        },

        {
            title: "04 DICE",
            file: "04 Dice.mp3"
        },

        {
            title: "05 YET I SMILING THROW MY ￥",
            file: "05 Yet I Smiling Throw My Yen.mp3"
        },

        {
            title: "06 LOTTERY BOY",
            file: "06 Lottery Boy.mp3"
        },

        {
            title: "07 NORIEGAS",
            file: "07 Noriegas.mp3"
        }

    ];

    const audio =
        document.getElementById("audio");

    const playButton =
        document.getElementById("playButton");

    const playButtonImage =
        document.getElementById("playButtonImage");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const songTitle =
        document.getElementById("songTitle");

    const playlist =
        document.getElementById("playlist");

    let currentSong = 0;

    songs.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.classList.add("song");

        item.textContent =
            song.title;

        item.addEventListener("click", () => {

            loadSong(index);
            playSong();

        });

        playlist.appendChild(item);

    });

    function loadSong(index) {

        currentSong = index;

        audio.src =
            songs[currentSong].file;

        songTitle.textContent =
            songs[currentSong].title;

        updatePlaylist();

    }

    function playSong() {

        audio.play();

        playButtonImage.src = "pause.png";
        playButtonImage.alt = "Pause";

    }

    function pauseSong() {

        audio.pause();

        playButtonImage.src = "play.png";
        playButtonImage.alt = "Play";

    }

    playButton.addEventListener("click", () => {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    });

    previousButton.addEventListener("click", () => {

        currentSong--;

        if (currentSong < 0) {

            currentSong =
                songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    });

    nextButton.addEventListener("click", () => {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    });

    audio.addEventListener("ended", () => {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    });

    function updatePlaylist() {

        const items =
            document.querySelectorAll(".song");

        items.forEach((item, index) => {

            if (index === currentSong) {

                item.classList.add("active");

            } else {

                item.classList.remove("active");

            }

        });

    }

    loadSong(0);

</script>

</body>
</html>

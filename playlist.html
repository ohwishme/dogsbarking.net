<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>may peace prevail on planet earth - stream</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            font-family: "MS Mincho", serif;
        }

        /* Black background */
        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        
        .player {
            position: relative;

            width: min(430px, 100%);
            aspect-ratio: 9 / 16;

            background-image: url("player_background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;

            box-shadow: 0 0 0px rgba(255, 255, 255, 0.08);
        }

        /*
         * Music player
         *
         * Original player width: 250px
         * Current size: 150% = 375px
         */
        .player-interface {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 375px;
            max-width: 80%;

            background: rgba(0, 0, 0, 0);

            color: white;

            padding: 15px;

            border-radius: 6px;

            font-family: "MS Mincho", serif;
        }

        /* Current song */
        .song-title {
            text-align: center;

            font-size: 15px;

            margin-bottom: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Controls */
        .controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }

        button {
            border: none;

            background: #fff;
            color: #000;

            padding: 8px 12px;

            font-family: "MS Mincho", serif;

            font-size: 12px;

            cursor: pointer;

            border-radius: 3px;
        }

        button:hover {
            background: #ddd;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Playlist */
        .playlist {
            max-height: 225px;

            overflow-y: auto;

            border-top: 1px solid rgba(255,255,255,0.3);

            padding-top: 8px;
        }

        .song {
            padding: 8px;

            cursor: pointer;

            border-radius: 3px;

            font-family: "MS Mincho", serif;

            font-size: 12px;
        }

        .song:hover {
            background: rgba(255,255,255,0.12);
        }

        .song.active {
            background: rgba(255,255,255,0.22);
        }

        /*
         * Mobile
         */
        @media (max-width: 600px) {

            .page {
                padding: 10px;
            }

         
            .player {
                width: min(486px, calc(100vw - 20px));
            }

            
            .player-interface {
                width: 78%;
                padding: 10px;
            }

            .song-title {
                font-size: 14px;
                margin-bottom: 8px;
            }

            button {
                padding: 6px 9px;
                font-size: 9px;
            }

            .controls {
                gap: 5px;
                margin-bottom: 8px;
            }

            .playlist {
                max-height: 140px;
            }

            .song {
                padding: 6px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="player">

        <div class="player-interface">

            <div class="song-title" id="songTitle">
                Select a song
            </div>

            <div class="controls">

                <button id="previousButton">
                    ◀
                </button>

                <button id="playButton">
                    ▶
                </button>

                <button id="nextButton">
                    ▶
                </button>

            </div>

            <div class="playlist" id="playlist">
            </div>

        </div>

    </div>

</div>


<audio id="audio"></audio>


<script>

    /*
     * ==========================================
     * PLAYLIST
     * ==========================================
     */

    const songs = [

        {
            title: "Song One",
            file: "chopped wood.wav"
        },

        {
            title: "Song Two",
            file: "chopped wood.wav"
        },


    ];


    const audio =
        document.getElementById("audio");

    const playButton =
        document.getElementById("playButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const songTitle =
        document.getElementById("songTitle");

    const playlist =
        document.getElementById("playlist");


    let currentSong = 0;


   
    songs.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.classList.add("song");

        item.textContent = song.title;

        item.addEventListener("click", () => {

            loadSong(index);
            playSong();

        });

        playlist.appendChild(item);

    });


    /*
     * Load a song
     */
    function loadSong(index) {

        currentSong = index;

        audio.src =
            songs[currentSong].file;

        songTitle.textContent =
            songs[currentSong].title;

        updatePlaylist();

    }


    /*
     * Play
     */
    function playSong() {

        audio.play();

        playButton.textContent = "❚❚";

    }


    /*
     * Pause
     */
    function pauseSong() {

        audio.pause();

        playButton.textContent = "▶";

    }


    /*
     * Play / Pause
     */
    playButton.addEventListener("click", () => {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    });


    /*
     * Previous song
     */
    previousButton.addEventListener("click", () => {

        currentSong--;

        if (currentSong < 0) {

            currentSong =
                songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    });


    /*
     * Next song
     */
    nextButton.addEventListener("click", () => {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    });


    /*
     * Automatically play the next song
     * when the current song finishes.
     */
    audio.addEventListener("ended", () => {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    });


    /*
     * Highlight currently selected song
     */
    function updatePlaylist() {

        const items =
            document.querySelectorAll(".song");

        items.forEach((item, index) => {

            if (index === currentSong) {

                item.classList.add("active");

            } else {

                item.classList.remove("active");

            }

        });

    }


    /*
     * Load first song without automatically playing it.
     */
    loadSong(0);

</script>

</body>
</html>
